    <title>Apex Pro Handyman Services | Licensed & Insured Home Repairs</title>
    <!-- Google Fonts: Oswald (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN for instant styling without build friction -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: '#002E5D',      // Deep Corporate Navy (Primary base)

                grayBg: '#F8FAFC',    // Light Neutral Slate
                cardBorder: '#E2E8F0',
                textDark: '#0F172A',  // Slate 900
                textMuted: '#475569'  // Slate 600
              }
            },
            fontFamily: {
              heading: ['Oswald', 'sans-serif'],
              sans: ['Inter', 'system-ui', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        color: #0F172A;
        background-color: #F8FAFC;
        -webkit-tap-highlight-color: transparent;
      }
